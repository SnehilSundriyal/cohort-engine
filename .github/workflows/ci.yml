name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cohort
          POSTGRES_PASSWORD: cohort
          POSTGRES_DB: cohort
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cohort"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COHORT_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/cohort?user=cohort&password=cohort
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (including JDBC against Postgres)
        run: ./mvnw -B verify
      - name: Benchmark smoke run (20k users)
        run: java -cp cohort-core/target/classes dev.snehil.cohort.bench.Benchmark 20000
